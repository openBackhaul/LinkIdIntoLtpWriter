network-control-domain:
  type: array
  x-key: local-id
  minItems: 4
  maxItems: 4
  items:
    type: object
    required:
      - local-id
      - control-construct
      - link
    properties:
      local-id:
        type: string
        enum:
          - 'candidate'
          - 'startup'
          - 'running'
          - 'operational'
        description: 'NMDA like data storages that document the NetworkControlDomain'
      control-construct:
        type: array
        x-key: local-id
        items:
          oneOf:
            - description: 'device - see 31_Device.yaml'
              type: object
      link:
        type: array
        x-key: local-id
        items:
          oneOf:
            - description: 'airLink - see 81_AirConnection.yaml'
              type: object

