link:
  type: array
  x-key: local-id
  items:
    oneOf:
      - description: 'airLink'
        type: object
        required:
          - local-id
          - linktp
        properties:
          local-id:
            type: string
            description: >
              'LinkId in RunningDS, localId in OperationalDS
              candidate: from [/v1/write-link-id-into-ltp$request.body#link-id]
              running: from candidate
              operational: string that is unique within the scope of the list
          linktp:
            type: array
            x-key: local-id
            minItems: 2
            maxItems: 2
            items:
              type: object
              required:
                - local-id
                - _cc
                - _ltp
              properties:
                local-id:
                  type: string
                _cc:
                  type: string
                  description: >
                    'MountName
                    candidate: from ???
                    running: from ???
                    operational: from ???
                _ltp:
                  type: string
                  description: >
                    'Identifier of the LTP
                    candidate: from ???
                    running: from ???
                    operational: from ???
          scores:
            type: array
            x-key: link-id
            minItems: 1
            items:
              type: object
              required:
                - link-id
                - candidate-score
              properties:
                link-id:
                  type: string
                  description: >
                    'LinkId
                    candidate: from ???
                    running: from ???
                    operational: from ???
                candidate-score:
                  description: >
                    'Probability of being the right LinkId of the connection between the referenced two LTPs
                    candidate: 1
                    running: 1
                    operational: from ???
