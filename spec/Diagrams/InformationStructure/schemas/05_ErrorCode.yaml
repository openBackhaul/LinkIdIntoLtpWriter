error-code:
  type: array
  x-key: error-code
  description: 'List of ErrorCodes with descriptions and corresponding ImplementationFunction'
  items:
    type: object
    required:
      - error-code
      - description
    properties:
      error-code:
        type: integer
        description: '(value must be unique and invariant)'
      description:
        type: string
      implementation-function:
        type: string
example:
  - error-code: 601
    description: 'OperationalDS::Ltp::externalLabel contains wrong value'
    implementation-function: 'p1-delete-external-label'
  - error-code: 602
    description: 'OperationalDS::Ltp::externalLabel does not contain value of OperationalDS::Link::calculatedLinkId'
    implementation-function: 'p1-copy-calculated-linkid-to-external-label'
  - error-code:
    description:
    implementation-function:
  - error-code:
    description:
    implementation-function:
  - error-code:
    description:
    implementation-function:
