control-construct:
  type: array
  x-key: local-id
  items:
    oneOf:
      - description: 'device'
        type: object
        required:
          - local-id
          - logical-termination-point
        properties:
          local-id:
            type: string
            description: >
              'MountName
              candidate: from ???
              running: from candidate
              operational: ???
          logical-termination-point:
            type: array
            x-key: local-id
            minItems: 1
            maxItems: 1
            items:
              type: object
              required:
                - local-id
                - external-label
              properties:
                local-id:
                  type: string
                external-label:
                  type: string
                  description: >
                    'LinkId as it should be configured in the device, respectively currently is configured in the device
                    candidate: from calculation ???
                    running: from ???
                    operational: from device ???
                planning-data:
                  type: object
                  required:
                    - tbd
                  properties:
                    tbd:
                      type: string
