implementation-script:
  type: array
  x-key: trigger-code
  description: 'List of the definitions of implementation sequences'

  description: >
    'List of the definitions of validation sequences
    The defined sequences are input to the generic ValidationOrchestrator Function
    ValidationOrchestrator is responding 204, if all Functions in the sequence responded 204 before, or any other response code resulted during executing the sequence'

What about?
  atomic : all or nothing 
  roll-back : how to define what to do in case of failure?
  



  items:
    type: object
    required:
      - trigger-code
      - sequence
    properties:
      trigger-code:
        type: integer
        description: 'Error code that triggers execution of this script'
      sequence:
        type: array
        x-key: step-number
        description: 'List of actions'
        items:
          type: object
          required:
            - step-number
            - _function-name
          properties:
            step-number:
              type: integer
              description: 'LocalId of this step (value must be unique and invariant)'
            _function-name:
              type: string
              description: 'Reference towards an entry in the list of Functions'
